spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-service-group    # ← GROUP 1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.pharmacy.*"
        spring.json.value.default.type: com.pharmacy.inventoryservice.event.OrderCreatedEvent
        spring.json.use.type.headers: false
    listener:
      ack-mode: record
      concurrency: 3

app:
  kafka:
    topic:
      order-events: order-events

logging:
  level:
    com.pharmacy.inventoryservice: DEBUG